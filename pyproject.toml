[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-market"
version = "2.12.0"
description = "Provider-agnostic market data, analysis, strategy research, risk and backtesting toolkit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31,<3",
    "websocket-client>=1.7,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["market"]
addopts = '-m "not integration"'
markers = [
    "integration: tests requiring live external market-data services or network access",
]
